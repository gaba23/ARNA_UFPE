<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Simulação de Monte Carlo</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='home.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon.png') }}">
    <img src="{{ url_for('static', path='avatar.png') }}" alt="Avatar">
</head>
<body>
    <header>
        <div class="logo">
            <a href="/home">ARNA</a>
        </div>
        <nav>
            <ul>
                <li class="dropdown">
                    <a href="/home">▼ Analisar</a>
                    <div class="dropdown-content">
                        <a href="/home">CPM</a>
                        <a href="/homePERT">PERT</a>
                        <a class="active" href="/monteCarlo">Simulação de Monte Carlo</a>
                    </div>
                </li>
                <li><a href="#">Resultado</a></li>
                <li><a href="/help">Ajuda</a></li>
                <li><a href="/contact">Contato</a></li>
                <li class="dropdown">
                    <a href="/home">
                        ▼ Baixar modelos
                    </a>
                    <div class="dropdown-content">
                        <a class="active" href="../static/cpm.xlsx" download="cpm.xlsx">CPM</a>
                        <a href="../static/pert.xlsx" download="pert.xlsx">PERT</a>
                        <a href="../static/montecarlo.xlsx" download="MonteCarlo.xlsx">Monte Carlo</a>
                    </div>
                </li>
            </ul>
        </nav>
        <div class="profile dropdown">
            <div class="profile-dropdown dropdown">
                <img src="{{ url_for('static', path='/avatar.png') }}" alt="Avatar" onclick="toggleDropdown()">
                <div class="dropdown-content dropdown">
                    <a href="/logout">Sair</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Análise de Rede com Simulação de Monte Carlo</h1>
        <form action="/analyzeMonteCarlo" method="POST" enctype="multipart/form-data">
            <div class="input-box">
                <textarea name="atividades" id="atividades" rows="4" cols="50" placeholder="Digite as atividades"></textarea>
                <textarea name="riscos" id="riscos" rows="4" cols="50" placeholder="Digite os riscos"></textarea>
            </div>

            <div id="table-container" class="input-table">
                <button id="enable-table-button">Show Table</button>
                <!--Tabela inserida dinamicamente aqui-->
            </div>

            <div class="input-box csv-input-box">
                <label class="csv-title" for="csv_file">Importar CSV:</label>
                <input type="file" name="csv_file" accept=".csv" id="csv_file" onchange="toggleInput(this)">
                <button class="remove-button" type="button" onclick="removeFile('csv_file')">X</button>
            </div>

            <div class="input-box xlsx-input-box">
                <label class="xlsx-title" for="xlsx_file">Importar Excel:</label>
                <input type="file" name="xlsx_file" accept=".xlsx" id="xlsx_file" onchange="toggleInput(this)">
                <button class="remove-button" type="button" onclick="removeFile('xlsx_file')">X</button>
            </div>

            <label for="num_iteracoes">Número de Iterações:</label>
            <input type="number" id="num_iteracoes" name="num_iteracoes" required>
            <button class="analyze-button" id="analyze-button" type="submit">Analisar</button>
        </form>
        
        {% if erro %}
        <p class="error-message">shit</p>
        {% endif %}
    </div>

    <script>
        function toggleInput(input) {
            var fileInputs = [
                document.getElementById('csv_file'),
                document.getElementById('xlsx_file')
            ];
            var textareas = [
                document.getElementById('atividades'),
                document.getElementById('riscos')
            ];
            var tableAtvInput = document.getElementById('inputTableActivityMC');
            var tableRiskInput = document.getElementById('inputTableRiskMC');

            if (input.value) {
                fileInputs.forEach(function(fileInput) {
                    if (fileInput !== input) {
                        fileInput.disabled = true;
                    }
                });
                textareas.forEach(function(textarea) {
                    textarea.disabled = true;
                });
                tableAtvInput.disabled = true;
                tableRiskInput.disabled = true;
            } else {
                var anyInputHasValue = fileInputs.some(function(fileInput) {
                    return fileInput.value;
                });

                if (!anyInputHasValue) {
                    fileInputs.forEach(function(fileInput) {
                        fileInput.disabled = false;
                    });
                    textareas.forEach(function(textarea) {
                        textarea.disabled = false;
                    });
                    tableAtvInput.disabled = true;
                    tableRiskInput.disabled = true;

                }
            }
        }
        
        function removeFile(inputId) {
            event.preventDefault(); 
            var fileInputs = [
                document.getElementById('csv_file'),
                document.getElementById('xlsx_file')
            ];
            var textareas = [
                document.getElementById('atividades'),
                document.getElementById('riscos')
            ];
            var input = document.getElementById(inputId);
            input.value = '';
            var anyInputHasValue = fileInputs.some(function(fileInput) {
                return fileInput.value;
            });

            if (!anyInputHasValue) {
                fileInputs.forEach(function(fileInput) {
                    fileInput.disabled = false;
                });
                textareas.forEach(function(textarea) {
                    textarea.disabled = false;
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function () {  // Tabela
            const tableContainer = document.getElementById("table-container");
            const enableTableButton = document.getElementById("enable-table-button");

            const tableHTML = `
                <table id="inputTableActivityMC">
                    <tbody>
                        <tr>
                            <th colspan="14"><h3>Inserir dados (atividades)</h3></th>
                        </tr>
                        <tr>
                            <td class="s"><input type="text" name="tabela_a_nome" placeholder="Nome"></td>
                            <td class="s"><input type="text" name="tabela_a_id" placeholder="ID"></td>
                            <td class="m"><input type="text" name="tabela_a_precedentes" placeholder="Precedentes"></td>
                            <td class="g"><input type="text" name="tabela_a_tipo_dist" placeholder="Tipo de Distribuição"></td>
                            <td class="m"><input type="text" name="tabela_a_t_min" placeholder="Tempo Mínimo"></td>
                            <td class="gg"><input type="text" name="tabela_a_t_provavel" placeholder="Tempo Mais Provável"></td>    
                            <td class="m"><input type="text" name="tabela_a_t_max" placeholder="Tempo Máximo"></td>                      
                            <td class="s"><input type="text" name="tabela_a_med" placeholder="Média"></td>
                            <td class="m"><input type="text" name="tabela_a_d_p" placeholder="Desvio Padrão"></td>
                            <td class="xg"><input type="text" name="tabela_a_prob_min" placeholder="Probabilidade do Tempo Mínimo"></td>
                            <td class="m"><input type="text" name="tabela_a_custo_fix" placeholder="Custo Fixo"></td>
                            <td class="xg"><input type="text" name="tabela_a_custo_un_t" placeholder="Custo por Unidade de Tempo"></td>
                        </tr>
                        <!-- Linhas adicionadas dinamicamente -->
                    </tbody>
                </table>
                <button class="row-input-activity" onclick="addRowActivity()">Add Row</button>

                <table id="inputTableRiskMC">
                    <tbody>
                        <tr>
                            <th colspan="12"><h3>Inserir dados (riscos)</h3></th>
                        </tr>
                        <tr>
                            <td class="s"><input type="text" name="tabela_r_nome" placeholder="Nome"></td>
                            <td class="s"><input type="text" name="tabela_r_id" placeholder="ID"></td>
                            <td class="m"><input type="text" name="tabela_r_tipo" placeholder="Tipo de Risco"></td>
                            <td class="xg"><input type="text" name="tabela_r_prob" placeholder="Probabilidade do Risco Ocorrer"></td>    
                            <td class="gg"><input type="text" name="tabela_r_custo" placeholder="Custo Variável Adicional"></td>
                            <td class="gg"><input type="text" name="tabela_r_custo_fix" placeholder="Custo Fixo Adicional"></td>
                            <td class="xxg"><input type="text" name="tabela_r_t_dist" placeholder="Tipo de Distribuição da Consequência"></td>
                            <td class="g"><input type="text" name="tabela_r_atv_afetadas" placeholder="Atividades Afetadas"></td>                      
                            <td class="m"><input type="text" name="tabela_r_atraso_min" placeholder="Atraso Mínimo"></td>
                            <td class="g"><input type="text" name="tabela_r_atraso_medio" placeholder="Atraso Mais Provável"></td>
                            <td class="m"><input type="text" name="tabela_r_atraso_max" placeholder="Atraso Máximo"></td>
                            <td class="s"><input type="text" name="tabela_r_media" placeholder="Média"></td>
                            <td class="m"><input type="text" name="tabela_r_d_p" placeholder="Desvio Padrão"></td>
                            <td class="xxg"><input type="text" name="tabela_r_prob_min" placeholder="Probabilidade do Atraso Mínimo"></td>
                        </tr>
                        <!-- Linhas adicionadas dinamicamente -->
                    </tbody>
                </table>
                <button class="row-input-risk" onclick="addRowRisk()">Add Row</button>
                
                <button id="disable-table-button">Hide Table</button>
            `;

            enableTableButton.addEventListener("click", function () {
                event.preventDefault();  // Evita que o botão de análise seja acionado

                tableContainer.innerHTML = tableHTML; 
                tableContainer.style.display = "block";
                enableTableButton.style.display = "none"; 
                document.querySelector('.container').style.width = "1700px";
                
            });

            tableContainer.addEventListener("click", function (event) {
                if (event.target && event.target.id === "disable-table-button") {
                    event.preventDefault(); 

                    hiddenTableHTML = `<button id="enable-table-button">Show Table</button>`;
                    tableContainer.innerHTML = hiddenTableHTML; 
                    tableContainer.style.display = "block";

                    document.querySelector('.container').style.width = "800px";
                }

                if (event.target && event.target.id === "enable-table-button") {
                    event.preventDefault(); 

                    hiddenTableHTML = `<button id="enable-table-button">Show Table</button>`;
                    tableContainer.innerHTML = tableHTML; 
                    tableContainer.style.display = "block";

                    document.querySelector('.container').style.width = "1700px";
                }
            });
        });

        document.getElementById("analyze-button").addEventListener("click", function (event) {
            if (document.getElementById("inputTableRiskMC")) {
                var tableRisk = document.getElementById("inputTableRiskMC");
                var rowsRisk = tableRisk.querySelectorAll("tbody tr");
                var tableDataRisk = [];

                rowsRisk.forEach(function (row) {
                    var cellsR = row.querySelectorAll("input");
                    var rowData = {
                        Nome: cellsR[0]?.value || "",
                        ID: cellsR[1]?.value || "",
                        Tipo_risco: cellsR[2]?.value || "",
                        Probabilidade_risco: cellsR[3]?.value || "",
                        Custo_var: cellsR[4]?.value || "",
                        Custo_fix: cellsR[5]?.value || "",
                        Tipo_distribuição: cellsR[6]?.value || "",
                        Atividades_afetadas: cellsR[7]?.value || "",
                        Atraso_min: cellsR[8]?.value || "",
                        Atraso_provável: cellsR[9]?.value || "",
                        Atraso_max: cellsR[10]?.value || "",
                        Média: cellsR[11]?.value || "",
                        Desvio_padrão: cellsR[12]?.value || "",
                        Probabilidade_min: cellsR[13]?.value || "",
                    };
                    tableDataRisk.push(rowData);
                });

                var tabelaInputR = document.createElement("input");
                tabelaInputR.type = "hidden";
                tabelaInputR.name = "tabela_risco";
                tabelaInputR.value = JSON.stringify(tableDataRisk);

                document.querySelector("form").appendChild(tabelaInputR);

            }

            if (document.getElementById("inputTableActivityMC")) {
                var tableAtv = document.getElementById("inputTableActivityMC");
                var rowsAtv = tableAtv.querySelectorAll("tbody tr");
                var tableDataAtv = [];

                rowsAtv.forEach(function (row) {
                    var cellsA = row.querySelectorAll("input");
                    var rowData = {
                        Nome: cellsA[0]?.value || "",
                        ID: cellsA[1]?.value || "",
                        Precedentes: cellsA[2]?.value || "",
                        Tipo_distribuição: cellsA[3]?.value || "",
                        T_min: cellsA[4]?.value || "",
                        T_provavel: cellsA[5]?.value || "",
                        T_max: cellsA[6]?.value || "",
                        Media: cellsA[7]?.value || "",
                        D_p: cellsA[8]?.value || "",
                        Prob_min: cellsA[9]?.value || "",
                        Custo_fixo: cellsA[10]?.value || "",
                        Custo_un_t: cellsA[11]?.value || "",
                    };
                    tableDataAtv.push(rowData);
                });

                var tabelaInputA = document.createElement("input");
                tabelaInputA.type = "hidden";
                tabelaInputA.name = "tabela_atividade";
                tabelaInputA.value = JSON.stringify(tableDataAtv);

                document.querySelector("form").appendChild(tabelaInputA);

            }

        });

        function addRowRisk() {
            event.preventDefault();  // Evita que o botão de análise seja acionado

            const tableBody = document.querySelector('#inputTableRiskMC tbody');
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="s"><input type="text" name="tabela_r_nome" placeholder="Nome"></td>
                <td class="s"><input type="text" name="tabela_r_id" placeholder="ID"></td>
                <td class="m"><input type="text" name="tabela_r_tipo" placeholder="Tipo de Risco"></td>
                <td class="xg"><input type="text" name="tabela_r_prob" placeholder="Probabilidade do Risco Ocorrer"></td>    
                <td class="gg"><input type="text" name="tabela_r_custo" placeholder="Custo Variável Adicional"></td>
                <td class="gg"><input type="text" name="tabela_r_custo_fix" placeholder="Custo Fixo Adicional"></td>
                <td class="xxg"><input type="text" name="tabela_r_t_dist" placeholder="Tipo de Distribuição da Consequência"></td>
                <td class="g"><input type="text" name="tabela_r_atv_afetadas" placeholder="Atividades Afetadas"></td>                      
                <td class="m"><input type="text" name="tabela_r_atraso_min" placeholder="Atraso Mínimo"></td>
                <td class="g"><input type="text" name="tabela_r_atraso_medio" placeholder="Atraso Mais Provável"></td>
                <td class="m"><input type="text" name="tabela_r_atraso_max" placeholder="Atraso Máximo"></td>
                <td class="s"><input type="text" name="tabela_r_media" placeholder="Média"></td>
                <td class="m"><input type="text" name="tabela_r_d_p" placeholder="Desvio Padrão"></td>
                <td class="xxg"><input type="text" name="tabela_r_prob_min" placeholder="Probabilidade do Atraso Mínimo"></td>
                <td><button class="delete-input-row" onclick="deleteRow(this)">Delete</button></td>
            `;

            tableBody.appendChild(newRow);
        }

        function addRowActivity() {
            event.preventDefault();  // Evita que o botão de análise seja acionado

            const tableBody = document.querySelector('#inputTableActivityMC tbody');
            const newRow = document.createElement('tr');

            newRow.innerHTML = `
                <td class="s"><input type="text" name="tabela_a_nome" placeholder="Nome"></td>
                <td class="s"><input type="text" name="tabela_a_id" placeholder="ID"></td>
                <td class="m"><input type="text" name="tabela_a_precedentes" placeholder="Precedentes"></td>
                <td class="g"><input type="text" name="tabela_a_tipo_dist" placeholder="Tipo de Distribuição"></td>
                <td class="m"><input type="text" name="tabela_a_t_min" placeholder="Tempo Mínimo"></td>
                <td class="gg"><input type="text" name="tabela_a_t_provavel" placeholder="Tempo Mais Provável"></td>    
                <td class="m"><input type="text" name="tabela_a_t_max" placeholder="Tempo Máximo"></td>                      
                <td class="s"><input type="text" name="tabela_a_med" placeholder="Média"></td>
                <td class="m"><input type="text" name="tabela_a_d_p" placeholder="Desvio Padrão"></td>
                <td class="xg"><input type="text" name="tabela_a_prob_min" placeholder="Probabilidade do Tempo Mínimo"></td>
                <td class="m"><input type="text" name="tabela_a_custo_fix" placeholder="Custo Fixo"></td>
                <td class="xg"><input type="text" name="tabela_a_custo_un_t" placeholder="Custo por Unidade de Tempo"></td>
                <td><button class="delete-input-row" onclick="deleteRow(this)">Delete</button></td>
            `;

            tableBody.appendChild(newRow);
        }

        function deleteRow(button) {
            const row = button.parentElement.parentElement;
            row.remove();
        }

    </script>

<footer style="margin-top: 450px;">
    <div class="footer-content">
        <div class="footer-logo">
            <img src="{{ url_for('static', path='/logoPMD.png') }}" alt="Random Logo">
        </div>
        <div class="footer-links">
            <a href="#">Termos</a>
            <a href="#">Privacidade</a>
            <a href="#">Cookies</a>
        </div>
    </div>
</footer>
</body>
</html>
