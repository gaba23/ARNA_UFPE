<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='/home.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}">
</head>
<body>
    <header>
        <div class="logo">
            <a href="/home">
                ARNA
            </a>
        </div>
        <nav>
            <ul>
                <li class="dropdown">
                    <a href="/home">
                        ▼ Analisar
                    </a>
                    <div class="dropdown-content">
                        <a href="/home">CPM</a>
                        <a class="active" href="/PERT">PERT</a>
                        <a href="/monteCarlo">Simulação de Monte Carlo</a>
                    </div>
                </li>
                <li><a href="#">Resultado</a></li>
                <li><a href="/help">Ajuda</a></li>
                <li><a href="/contact">Contato</a></li>
                <li class="dropdown">
                    <a href="/home">
                        ▼ Baixar modelos
                    </a>
                    <div class="dropdown-content">
                        <a class="active" href="../static/cpm.xlsx" download="cpm.xlsx">CPM</a>
                        <a href="../static/pert.xlsx" download="pert.xlsx">PERT</a>
                        <a href="../static/montecarlo.xlsx" download="MonteCarlo.xlsx">Monte Carlo</a>
                    </div>
                </li>
            </ul>
        </nav>
        <div class="profile dropdown">
            <div class="profile-dropdown dropdown">
                <img src="{{ url_for('static', path='/avatar.png') }}" alt="Avatar" onclick="toggleDropdown()">
                <div class="dropdown-content dropdown">
                    <a href="/logout">Sair</a>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <h1>Análise de Rede: PERT</h1>
        <form action="/analyzePERT" method="POST" enctype="multipart/form-data">
            <div class="input-box">
                <textarea name="atividades" id="atividades" rows="4" cols="50" placeholder="Digite as atividades"></textarea>
            </div>

            <div id="table-container" class="input-table-pert">
                <button id="enable-table-button">Show Table</button>
                <!--Tabela inserida dinamicamente aqui-->
            </div>

            <div class="input-box csv-input-box">
                <label class="csv-title" for="csv_file">Importar CSV:</label>
                <input type="file" name="csv_file" accept=".csv" id="csv_file">
                <button class="remove-button" onclick="removeFile('csv_file')">X</button>
            </div>

            <div class="input-box xlsx-input-box">
                <label class="xlsx-title" for="xlsx_file">Importar Excel:</label>
                <input type="file" name="xlsx_file" accept=".xlsx" id="xlsx_file">
                <button class="remove-button" onclick="removeFile('xlsx_file')">X</button>
            </div>

            <button class="analyze-button" class="analyze-button" type="submit">Analisar</button>
        </form>
        
        {% if erro %}
        <p class="error-message">{{ erro }}</p>
        {% endif %}
    </div>

    <script>
        function toggleInput(input) {
            var fileInputs = [
                document.getElementById('csv_file'),
                document.getElementById('xlsx_file')
            ];
            var textarea = document.getElementById('atividades');
            var tableInput = document.getElementById('inputTablePert')

            if (input.value) {
                fileInputs.forEach(function(fileInput) {
                    if (fileInput !== input) {
                        fileInput.disabled = true;
                    }
                });
                textarea.disabled = true;
                tableInput.disabled = true;
            } else {
                var anyInputHasValue = fileInputs.some(function(fileInput) {
                    return fileInput.value;
                });

                if (!anyInputHasValue) {
                    fileInputs.forEach(function(fileInput) {
                        fileInput.disabled = false;
                    });
                    textarea.disabled = false;
                    tableInput.disabled = true;

                }
            }
        }

        function removeFile(inputId) {
            event.preventDefault(); 
            var fileInputs = [
                document.getElementById('csv_file'),
                document.getElementById('xlsx_file')
            ];
            var textareas = [
                document.getElementById('atividades'),
                document.getElementById('riscos')
            ];
            var tableInput = document.getElementById('inputTablePert')
            var input = document.getElementById(inputId);
            input.value = '';
            var anyInputHasValue = fileInputs.some(function(fileInput) {
                return fileInput.value;
            });

            if (!anyInputHasValue) {
                fileInputs.forEach(function(fileInput) {
                    fileInput.disabled = false;
                });
                textareas.forEach(function(textarea) {
                    textarea.disabled = false;
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function () {  // Tabela
            const tableContainer = document.getElementById("table-container");
            const enableTableButton = document.getElementById("enable-table-button");

            const tableHTML = `
                <table id="inputTablePert">
                    <tbody>
                        <tr>
                            <th colspan="5"><h3>Inserir dados</h3></th>
                        </tr>
                        <tr>
                            <td><input type="text" name="Atividades" placeholder="Atividade"></td>
                            <td><input type="text" name="Precedentes" placeholder="Precedente"></td>
                            <td><input type="text" name="t_otimista" placeholder="Tempo Otimista"></td>
                            <td><input type="text" name="t_pessimista" placeholder="Tempo Pessimista"></td>
                            <td><input type="text" name="t_provavel" placeholder="Tempo Provável"></td>
                            <!-- Linhas adicionadas dinamicamente -->
                        </tr>
                    </tbody>
                </table>
                <button class="row-input" onclick="addRow()">Add Row</button>

                <button id="disable-table-button">Hide Table</button>
            `;

            enableTableButton.addEventListener("click", function () {
                event.preventDefault();  // Evita que o botão de análise seja acionado

                tableContainer.innerHTML = tableHTML; 
                tableContainer.style.display = "block";
                enableTableButton.style.display = "none"; 

            });

            tableContainer.addEventListener("click", function (event) {
                if (event.target && event.target.id === "disable-table-button") {
                    event.preventDefault(); 

                    hiddenTableHTML = `<button id="enable-table-button">Show Table</button>`;
                    tableContainer.innerHTML = hiddenTableHTML;
                    tableContainer.style.display = "block";
                }

                if (event.target && event.target.id === "enable-table-button") {
                    event.preventDefault(); 

                    hiddenTableHTML = `<button id="enable-table-button">Show Table</button>`;
                    tableContainer.innerHTML = tableHTML; 
                    tableContainer.style.display = "block";
                }
            });
        });

        document.querySelector(".analyze-button").addEventListener("click", function (event) {
            if (document.getElementById("inputTablePert")) {
                var table = document.getElementById("inputTablePert");
                var rows = table.querySelectorAll("tbody tr");
                var tableData = [];

                rows.forEach(function (row) {
                    var cells = row.querySelectorAll("input");
                    var rowData = {
                        Atividade: cells[0]?.value || "",
                        Precedentes: cells[1]?.value || "",
                        t_otimista: cells[2]?.value || "",
                        t_pessimista: cells[3]?.value || "",
                        t_provavel: cells[4]?.value || "",
                    };
                    tableData.push(rowData);
                });

                var tabelaInput = document.createElement("input");
                tabelaInput.type = "hidden";
                tabelaInput.name = "tabela";
                tabelaInput.value = JSON.stringify(tableData);

                this.closest("form").appendChild(tabelaInput);
                }
        });


        function addRow() {
            event.preventDefault();  // Evita que o botão de análise seja acionado
            const tableBody = document.querySelector('#inputTablePert tbody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td><input type="text" name="atividades" placeholder="Atividade"></td>
                <td><input type="text" name="precedentes" placeholder="Precedente"></td>
                <td><input type="text" name="t_otimista" placeholder="Tempo Otimista"></td>
                <td><input type="text" name="t_pessimista" placeholder="Tempo Pessimista"></td>
                <td><input type="text" name="t_provavel" placeholder="Tempo Provável"></td>
                <td><button class="delete-input-row" onclick="deleteRow(this)">Delete</button></td>
            `;

            tableBody.appendChild(newRow);
        }

        function deleteRow(button) {
            const row = button.parentElement.parentElement;
            row.remove();
        }
    
    </script>

<footer style="margin-top: 450px;">
    <div class="footer-content">
        <div class="footer-logo">
            <img src="{{ url_for('static', path='/logoPMD.png') }}" alt="Random Logo">
        </div>
        <div class="footer-links">
            <a href="#">Termos</a>
            <a href="#">Privacidade</a>
            <a href="#">Cookies</a>
        </div>
    </div>
</footer>
</body>
</html>
